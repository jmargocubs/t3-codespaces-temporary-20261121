name: Core validation
on:
  push:
    branches: [kyro-core-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build --package-path Packages/KyroMediaCore -j 2
      - run: swift test --package-path Packages/KyroMediaCore -j 2
